<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <style>
    #pika {
      filter: none;
    }

    @media (prefers-color-scheme: dark) {
      #pika {
        filter: invert(1);
      }
    }
  </style>
  <image
    id="pika"
    width="128"
    height="128"
    href="data:image/png;base64,"
  />
</svg>
