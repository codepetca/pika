name: CI

on:
  pull_request:
    branches: [main, production]
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  classify-changes:
    name: Classify Changes
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.draft == false && github.event.action == 'ready_for_review')
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.classify.outputs.mode }}
      docs_only: ${{ steps.classify.outputs.docs_only }}
      run_test_build: ${{ steps.classify.outputs.run_test_build }}
      run_database: ${{ steps.classify.outputs.run_database }}
      run_browser: ${{ steps.classify.outputs.run_browser }}

    steps:
      - name: Checkout code with change history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Select risk-matched checks
        id: classify
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          TARGET_BRANCH: ${{ github.event.pull_request.base.ref }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPOSITORY: ${{ github.event.pull_request.base.repo.full_name }}
          FULL_CI: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          if [[ "$FULL_CI" == "true" ]]; then
            node scripts/classify-ci-changes.mjs --full --github-output "$GITHUB_OUTPUT"
          else
            git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main
            MAIN_SHA="$(git rev-parse origin/main)"
            node scripts/classify-ci-changes.mjs \
              --base "$BASE_SHA" \
              --head "$HEAD_SHA" \
              --target "$TARGET_BRANCH" \
              --head-branch "$HEAD_BRANCH" \
              --main-sha "$MAIN_SHA" \
              --head-repository "$HEAD_REPOSITORY" \
              --base-repository "$BASE_REPOSITORY" \
              --github-output "$GITHUB_OUTPUT"
          fi

  architecture-database-contracts:
    name: Architecture Database Contracts
    needs: classify-changes
    if: needs.classify-changes.outputs.run_database == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.103.0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.25.0

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_ENV"

      - name: Restore pnpm store cache
        id: database-pnpm-cache
        uses: actions/cache@v6
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        id: database-install
        shell: bash
        run: pnpm install --frozen-lockfile

      - name: Summarize dependency setup evidence
        if: always()
        shell: bash
        run: |
          {
            echo '### Database lane setup evidence'
            echo "- pnpm store exact-key hit: ${{ steps.database-pnpm-cache.outputs.cache-hit }} (false means prefix restore or miss)"
            echo '- Dependencies are always installed from the lockfile.'
            echo '- Supabase remains a fresh ephemeral start and migration replay.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify managed-storage migration lineage
        run: pnpm run check:managed-storage-lineage

      - name: Start ephemeral Supabase and replay migrations
        run: supabase start -x analytics,edge-runtime,functions,imgproxy,inbucket,meta,realtime,studio,vector

      - name: Rehearse the production-shaped Test identity migration
        run: bash scripts/check-blueprint-question-identity-migration-lifecycle.sh

      - name: Check generated database types
        run: pnpm run db:types:check

      - name: Verify classroom creation entitlements and active-limit concurrency
        run: bash scripts/check-classroom-creation-entitlements-database.sh

      - name: Verify account plans and isolated Stripe billing contracts
        run: |
          bash scripts/check-account-plan-foundation-database.sh
          bash scripts/check-stripe-billing-foundation-database.sh
          bash scripts/check-stripe-checkout-database.sh
          bash scripts/check-subscription-lifecycle-database.sh
          bash scripts/check-subscription-renewal-closeout-database.sh
          bash scripts/check-subscription-prorated-upgrades-database.sh

      - name: Verify Gradebook score override deletion lifecycle
        run: bash scripts/check-gradebook-score-overrides-database.sh

      - name: Verify Gradebook maximum override calculations and ownership
        run: bash scripts/check-gradebook-maximum-overrides-database.sh

      - name: Standalone Gradebook item database contracts
        run: bash scripts/check-standalone-gradebook-items-database.sh

      - name: Preserving classroom student removal database contracts
        run: bash scripts/check-student-classroom-removal-database.sh

      - name: Pal membership identity lifecycle contracts
        run: bash scripts/check-pal-membership-database.sh

      - name: Classroom Pal signal and delivery contracts
        run: bash scripts/check-pal-classroom-database.sh

      - name: Removed-membership academic cleanup database contracts
        run: bash scripts/check-removed-student-academic-database.sh

      - name: Explicit live membership purge and fresh rejoin contracts
        run: bash scripts/check-live-student-cleanup-database.sh

      - name: Automatic removed-student cleanup queue contracts
        run: bash scripts/check-automatic-removed-student-cleanup-database.sh

      - name: Automatic cleanup gate serialization contracts
        run: bash scripts/check-automatic-removed-student-cleanup-concurrency.sh

      - name: Verify retained roster group consumer rollback contracts
        run: |
          bash scripts/check-retained-roster-group-cleanup-database.sh
          set +e
          group_cleanup_output=$(bash scripts/check-retained-roster-group-cleanup-database.sh --force-failure 2>&1)
          group_cleanup_status=$?
          set -e
          if ! [[ "$group_cleanup_status" -eq 1 ]] \
            || ! grep -Fxq 'FAIL forced retained roster group cleanup wrapper failure.' <<< "$group_cleanup_output" \
            || ! grep -Fxq 'PASS retained roster group cleanup exact teardown.' <<< "$group_cleanup_output"; then
            echo 'FAIL unexpected retained group forced teardown proof.'
            exit 1
          fi
          echo 'PASS exact retained group intentional post-teardown failure.'

      - name: Verify retained cleanup two-session locks and installed SDK ACL
        run: |
          pnpm exec tsx scripts/check-retained-roster-group-locks-database.ts
          pnpm exec tsx scripts/check-retained-roster-group-discovery-sdk.ts
          set +e
          group_sdk_output=$(pnpm exec tsx scripts/check-retained-roster-group-discovery-sdk.ts --force-failure 2>&1)
          group_sdk_status=$?
          set -e
          if ! [[ "$group_sdk_status" -eq 1 ]] \
            || ! grep -Fxq 'FAIL forced retained cleanup SDK proof.' <<< "$group_sdk_output" \
            || ! grep -Fxq 'PASS retained cleanup SDK unchanged local baseline.' <<< "$group_sdk_output"; then
            echo 'FAIL unexpected retained SDK forced baseline proof.'
            exit 1
          fi
          echo 'PASS exact retained SDK intentional failure and unchanged baseline.'

      - name: Verify PPZ3C start-date correction lifecycle
        run: bash scripts/check-ppz3c-start-date-correction-database.sh

      - name: Lint all database functions at error level
        run: supabase db lint --local --level error --fail-on error

      - name: Verify authentication session revocation and rate limits
        run: bash scripts/check-auth-session-security-database.sh

      - name: Verify coordinated attendance decommission database contracts
        run: bash scripts/check-attendance-decommission-database.sh

      - name: Require warning-free database functions
        run: supabase db lint --local --level warning --fail-on warning

      - name: Verify Course Guide import shared lease and rate window
        run: bash scripts/check-course-guide-import-rate-limit-database.sh

      - name: Verify Blueprint draft admission and rolling quota
        run: bash scripts/check-course-blueprint-draft-admission-database.sh

      - name: Verify classroom guided draft provenance and atomic creation
        run: bash scripts/check-classroom-guided-draft-provenance-database.sh

      - name: Verify Bara attendance tenancy, ordering, and deletion guards
        run: pnpm run check:bara-attendance-db

      - name: Verify Pal outbox claim concurrency and lease recovery
        run: bash scripts/check-pal-outbox-concurrency.sh

      - name: Verify Pal HTTP outage and queued recovery
        run: pnpm run smoke:pal-delivery-recovery

      - name: Verify atomic assignment feedback returns
        run: bash scripts/check-atomic-assignment-feedback-returns.sh

      - name: Verify Assignment AI grading lease fencing
        run: bash scripts/check-assignment-ai-grading-lease-fencing.sh

      - name: Verify metered Assignment AI grading
        run: bash scripts/check-metered-assignment-ai-grading.sh

      - name: Verify Gradebook category contracts
        run: bash scripts/check-gradebook-categories-database.sh

      - name: Verify contextual calendar atomicity and privileges
        run: bash scripts/check-contextual-calendar-database.sh

      - name: Verify contextual calendar concurrent writers
        shell: bash
        run: |
          node scripts/check-contextual-calendar-concurrency.mjs
          cleanup_log="$(mktemp)"
          if node scripts/check-contextual-calendar-concurrency.mjs --verify-cleanup-after-fixture > "$cleanup_log" 2>&1; then
            cat "$cleanup_log"
            echo 'Expected the forced post-fixture failure' >&2
            exit 1
          fi
          cat "$cleanup_log"
          grep -F 'FAIL Forced calendar concurrency post-fixture cleanup proof' "$cleanup_log"
          grep -F 'PASS exact synthetic calendar concurrency cleanup, zero residual rows and global baseline counts' "$cleanup_log"

      - name: Verify contextual calendar owner SDK and failed-fixture cleanup
        shell: bash
        run: |
          pnpm exec tsx scripts/check-contextual-class-day-owner-writes.ts
          cleanup_log="$(mktemp)"
