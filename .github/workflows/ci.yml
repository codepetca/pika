        run: bash scripts/check-contextual-assignment-open-classwork-database.sh

      - name: Verify contextual learner assignment-open concurrent authorization
        run: node scripts/check-contextual-assignment-doc-open-concurrency.mjs

      - name: Verify contextual learner assignment-save atomicity and privileges
