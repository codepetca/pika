name: CI

on:
  pull_request:
    branches: [main, production]
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  classify-changes:
    name: Classify Changes
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.classify.outputs.mode }}
      docs_only: ${{ steps.classify.outputs.docs_only }}
      run_test_build: ${{ steps.classify.outputs.run_test_build }}
      run_database: ${{ steps.classify.outputs.run_database }}
      run_browser: ${{ steps.classify.outputs.run_browser }}

    steps:
      - name: Checkout code with change history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Select risk-matched checks
        id: classify
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          TARGET_BRANCH: ${{ github.event.pull_request.base.ref }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPOSITORY: ${{ github.event.pull_request.base.repo.full_name }}
          FULL_CI: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          if [[ "$FULL_CI" == "true" ]]; then
            node scripts/classify-ci-changes.mjs --full --github-output "$GITHUB_OUTPUT"
          else
            git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main
            MAIN_SHA="$(git rev-parse origin/main)"
            node scripts/classify-ci-changes.mjs \
              --base "$BASE_SHA" \
              --head "$HEAD_SHA" \
              --target "$TARGET_BRANCH" \
              --head-branch "$HEAD_BRANCH" \
              --main-sha "$MAIN_SHA" \
              --head-repository "$HEAD_REPOSITORY" \
              --base-repository "$BASE_REPOSITORY" \
              --github-output "$GITHUB_OUTPUT"
          fi

  architecture-database-contracts:
    name: Architecture Database Contracts
    needs: classify-changes
    if: needs.classify-changes.outputs.run_database == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.103.0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.25.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify managed-storage migration lineage
        run: pnpm run check:managed-storage-lineage

      - name: Start ephemeral Supabase and replay migrations
        run: supabase start -x analytics,edge-runtime,functions,imgproxy,inbucket,meta,realtime,studio,vector

      - name: Rehearse the production-shaped Test identity migration
        run: bash scripts/check-blueprint-question-identity-migration-lifecycle.sh

      - name: Check generated database types
        run: pnpm run db:types:check

      - name: Lint all database functions at error level
        run: supabase db lint --local --level error --fail-on error

      - name: Verify Bara attendance tenancy, ordering, and deletion guards
        run: pnpm run check:bara-attendance-db

      - name: Verify Pal outbox claim concurrency and lease recovery
        run: bash scripts/check-pal-outbox-concurrency.sh

      - name: Verify Pal HTTP outage and queued recovery
        run: pnpm run smoke:pal-delivery-recovery

      - name: Verify atomic assignment feedback returns
        run: bash scripts/check-atomic-assignment-feedback-returns.sh

      - name: Verify atomic assignment draft and submission integrity
        run: bash scripts/check-atomic-assignment-submissions.sh

      - name: Verify assignment submission concurrency
        run: bash scripts/check-assignment-submission-concurrency.sh

      - name: Verify atomic student test submission
        run: bash scripts/check-atomic-test-submit.sh

      - name: Verify atomic Test publication
        run: bash scripts/check-test-publication-atomicity.sh

      - name: Verify atomic test grading
        run: bash scripts/check-atomic-test-grading.sh

      - name: Verify test document snapshot concurrency and cleanup
        run: bash scripts/check-test-document-snapshot-concurrency.sh

      - name: Verify managed-storage ownership and enforcement
        run: bash scripts/check-managed-storage-database.sh

      - name: Verify managed deletion health monitoring
        run: pnpm run check:managed-deletion-health-db

      - name: Verify cleanup-history cron run ledger
        run: pnpm run check:cleanup-history-cron-db

      - name: Lint hot archived classroom purge database functions
        run: pnpm run check:classroom-purge-db-lint

      - name: Verify hot archived classroom purge durability and concurrency
        run: bash scripts/check-hot-archived-classroom-purge-database.sh

      - name: Verify cold archived classroom purge durability and preservation
        run: pnpm run check:cold-classroom-purge-db

      - name: Verify individual-student purge isolation and durability
        run: pnpm run check:student-purge-db

      - name: Verify individual-student purge failure concurrency
        run: bash scripts/check-individual-student-purge-failure-concurrency.sh

      - name: Verify atomic blueprint rollback and replay
        run: bash scripts/check-atomic-blueprint-operations.sh

      - name: Verify versioned Blueprint proposals and deletion safety
        run: bash scripts/check-versioned-course-blueprint-database.sh

      - name: Verify Blueprint test-question identity mapping
        run: bash scripts/check-blueprint-question-ordinal-identity.sh

      - name: Verify durable Course Blueprint purge
        run: bash scripts/check-course-blueprint-purge-database.sh

      - name: Verify Classroom and Blueprint purge admission concurrency
        run: bash scripts/check-classroom-blueprint-purge-concurrency-database.sh

      - name: Verify archive operations and lifecycle evidence
        run: bash scripts/check-classroom-archive-database.sh

      - name: Verify atomic archive compaction rollback and cleanup staging
        run: bash scripts/check-classroom-archive-compaction-database.sh

      - name: Verify archive compatibility and retired Quiz schema removal
        run: bash scripts/check-legacy-quiz-freeze-backfill.sh

      - name: Verify Gradex extract operations and retention cleanup
        run: bash scripts/check-classroom-gradex-database.sh

      - name: Audit classroom ownership graph and primary keys
        run: pnpm exec tsx scripts/check-classroom-resource-schema.ts
        env:
          CLASSROOM_SCHEMA_AUDIT_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
          CLASSROOM_SCHEMA_AUDIT_LOCAL: "true"

      - name: Rehearse full classroom archive recovery on local Supabase
        run: pnpm verify:classroom-archive-recovery

      - name: Stop ephemeral database
        if: always()
        run: supabase stop --no-backup

  test-and-build:
    name: Test & Build
    needs: classify-changes
    if: needs.classify-changes.result == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.25.0

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_ENV"

      - name: Setup pnpm cache
        uses: actions/cache@v6
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check workflow and documentation contracts
        run: pnpm run check:workflow

      - name: Check architecture boundaries
        if: needs.classify-changes.outputs.run_test_build == 'true'
        run: pnpm run check:architecture

      - name: Check governed UI imports and native controls
        if: needs.classify-changes.outputs.run_test_build == 'true'
        run: pnpm run check:ui-policy

      - name: Check governed design values
        if: needs.classify-changes.outputs.run_test_build == 'true'
        run: pnpm run check:design-policy

      - name: "Check No dark: Classes in App Code"
        if: needs.classify-changes.outputs.run_test_build == 'true'
        run: |
          echo "Checking for dark: classes outside /ui..."

          # Collect dark: usages outside /ui (excluding tiptap and logo which uses image filters)
          DARK_MATCHES="$(
            grep -r "dark:" src/app src/components --include="*.tsx" |
              grep -v "src/ui/" |
              grep -v "src/components/tiptap" |
              grep -v "PikaLogo.tsx" ||
              true
          )"
          DARK_COUNT="$(printf '%s' "$DARK_MATCHES" | awk 'NF { count++ } END { print count + 0 }')"

          if [ "$DARK_COUNT" -gt 0 ]; then
            echo "ERROR: Found $DARK_COUNT dark: classes outside /ui"
            echo ""
            echo "Files with dark: classes:"
            printf '%s\n' "$DARK_MATCHES" | cut -d: -f1 | sort -u
            echo ""
            echo "Use semantic tokens instead (bg-surface, text-text-default, border-border, etc.)"
            echo "See src/ui/README.md for the design system documentation."
            exit 1
          fi

          echo "All dark: classes are properly contained in /ui!"

      - name: Run tests with coverage
        if: needs.classify-changes.outputs.run_test_build == 'true'
        run: pnpm run test:coverage

      - name: Check TypeScript
        if: needs.classify-changes.outputs.run_test_build == 'true'
        run: npx tsc --noEmit

      - name: Run linter
        if: needs.classify-changes.outputs.run_test_build == 'true'
        run: pnpm run lint

      - name: Build production bundle
        if: needs.classify-changes.outputs.run_test_build == 'true'
        run: pnpm run build
        env:
          # Required environment variables for build
          # These are dummy values for CI - real values are in Vercel
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: placeholder-publishable-key
          SUPABASE_SECRET_KEY: placeholder-secret-key
          SESSION_SECRET: placeholder-session-secret-at-least-32-chars-long

      - name: Upload coverage reports
        if: failure() && needs.classify-changes.outputs.run_test_build == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

  browser-experience-matrix:
    name: Browser Experience Matrix
    needs: classify-changes
    if: needs.classify-changes.outputs.run_browser == 'true'
    runs-on: ubuntu-latest
    env:
      E2E_BASE_URL: http://localhost:3000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      SESSION_SECRET: ci-browser-session-secret-with-at-least-32-characters
      ENABLE_MOCK_EMAIL: "true"

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.103.0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.25.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Start ephemeral Supabase and replay migrations
        run: supabase start -x analytics,edge-runtime,functions,imgproxy,inbucket,meta,realtime,studio,vector

      - name: Export local Supabase environment
        shell: bash
        run: |
          eval "$(supabase status -o env \
            --override-name api.url=NEXT_PUBLIC_SUPABASE_URL \
            --override-name auth.anon_key=NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY \
            --override-name auth.service_role_key=SUPABASE_SECRET_KEY)"
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$NEXT_PUBLIC_SUPABASE_URL"
            echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY"
            echo "SUPABASE_SECRET_KEY=$SUPABASE_SECRET_KEY"
          } >> "$GITHUB_ENV"

      - name: Seed browser fixtures
        run: pnpm seed

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run combined browser contracts
        run: pnpm e2e:ci

      - name: Upload browser diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: browser-experience-matrix
          path: |
            playwright-report/
            test-results/
          retention-days: 7

      - name: Stop ephemeral database
        if: always()
        run: supabase stop --no-backup

  pr-gate:
    name: PR Gate
    if: >-
      always() &&
      (github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false)
    needs:
      - classify-changes
      - architecture-database-contracts
      - test-and-build
      - browser-experience-matrix
    runs-on: ubuntu-latest

    steps:
      - name: Verify every selected check passed
        shell: bash
        env:
          CLASSIFY_RESULT: ${{ needs.classify-changes.result }}
          TEST_BUILD_RESULT: ${{ needs.test-and-build.result }}
          TEST_BUILD_REQUIRED: ${{ needs.classify-changes.outputs.run_test_build }}
          DATABASE_REQUIRED: ${{ needs.classify-changes.outputs.run_database }}
          DATABASE_RESULT: ${{ needs.architecture-database-contracts.result }}
          BROWSER_REQUIRED: ${{ needs.classify-changes.outputs.run_browser }}
          BROWSER_RESULT: ${{ needs.browser-experience-matrix.result }}
          CI_MODE: ${{ needs.classify-changes.outputs.mode }}
        run: |
          printf 'CI mode: %s\n' "$CI_MODE"
          [[ "$CLASSIFY_RESULT" == "success" ]] || {
            echo "Change classification did not succeed: $CLASSIFY_RESULT"
            exit 1
          }
          [[ "$TEST_BUILD_RESULT" == "success" ]] || {
            echo "Test & Build did not succeed: $TEST_BUILD_RESULT"
            exit 1
          }
          case "$CI_MODE:$TEST_BUILD_REQUIRED:$DATABASE_REQUIRED:$BROWSER_REQUIRED" in
            full:true:true:true | \
            docs-only:false:false:false | \
            production-promotion:true:false:false | \
            application-database:true:true:false | \
            application-browser:true:false:true | \
            application-database-browser:true:true:true | \
            application-test-build:true:false:false)
              ;;
            *)
              echo "Invalid or inconsistent CI selectors: mode=$CI_MODE test_build=$TEST_BUILD_REQUIRED database=$DATABASE_REQUIRED browser=$BROWSER_REQUIRED"
              exit 1
              ;;
          esac
          if [[ "$DATABASE_REQUIRED" == "true" && "$DATABASE_RESULT" != "success" ]]; then
            echo "Architecture Database Contracts were required but ended: $DATABASE_RESULT"
            exit 1
          fi
          if [[ "$BROWSER_REQUIRED" == "true" && "$BROWSER_RESULT" != "success" ]]; then
            echo "Browser Experience Matrix was required but ended: $BROWSER_RESULT"
            exit 1
          fi
          echo "All risk-matched checks passed."
