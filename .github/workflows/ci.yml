            grep -Fx "FAIL forced isolated assignment-list lifecycle: ${assignment_list_mode}." "$assignment_list_log"
            grep -Fx 'PASS isolated assignment-list exact teardown and unchanged canonical baseline.' "$assignment_list_log"
          done

      - name: Verify isolated contextual Assignment overview reads
        shell: bash
        run: |
          assignment_overview_head=$(git rev-parse HEAD)
