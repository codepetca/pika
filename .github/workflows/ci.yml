        run: |
          assignment_list_head=$(git rev-parse HEAD)
          assignment_list_log=$(mktemp)
          trap 'rm -f -- "$assignment_list_log"' EXIT
          pnpm exec tsx scripts/check-contextual-assignment-list-lifecycle.ts --reviewed-head "$assignment_list_head" --mode normal
          for assignment_list_mode in after-fixture before-capture; do
            assignment_list_status=0
            pnpm exec tsx scripts/check-contextual-assignment-list-lifecycle.ts --reviewed-head "$assignment_list_head" --mode "$assignment_list_mode" > "$assignment_list_log" 2>&1 || assignment_list_status=$?
