name: Appearance CI pilot

on:
  pull_request:
    branches: [main]
    types: [ready_for_review]

permissions:
  contents: read

jobs:
  appearance-pilot:
    name: Calendar and Join appearance pilot
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'codex/calendar-ci-timing-pilot'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      E2E_BASE_URL: http://localhost:3000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      SESSION_SECRET: appearance-pilot-loopback-session-secret-with-at-least-32-characters

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Record tested merge commit
        run: git log -1 --format='%H %P'

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.25.0

      - name: Get pnpm store directory
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_ENV"

      - name: Restore pnpm store cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore Playwright browser cache
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/pnpm-lock.yaml') }}

      - name: Install Chromium and system dependencies
        run: pnpm exec playwright install --with-deps chromium

      - name: Verify advisory diff selection
        run: pnpm exec vitest run --maxWorkers=1 tests/unit/appearance-ci-pilot-diff.test.ts

      - name: Verify broad fallbacks and contrast rejection
        run: node scripts/appearance-ci-pilot-run.mjs fallbacks

      - name: Check the first Calendar palette and Join copy
        run: node scripts/appearance-ci-pilot-run.mjs first

      - name: Check the second Calendar palette and Join copy
        run: node scripts/appearance-ci-pilot-run.mjs second

      - name: Verify the tracked checkout was restored
        if: always()
        run: git diff --exit-code HEAD

      - name: Retain pilot screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: appearance-pilot-screenshots
          path: test-results/**/*.png
          if-no-files-found: warn
          retention-days: 7
